
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭлЖур v7</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='100%25' x2='100%25' y2='0%25'%3E%3Cstop offset='0%25' stop-color='%232563eb' /%3E%3Cstop offset='100%25' stop-color='%234f46e5' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='url(%23g)' /%3E%3Ctext x='32' y='46' fill='%23ffffff' font-family='system-ui, sans-serif' font-weight='bold' font-size='38' text-anchor='middle'%3EЭ%3C/text%3E%3C/svg%3E">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { 
                sans: ['var(--font-body, "Inter")', 'sans-serif'],
                display: ['var(--font-heading, "Inter")', 'sans-serif']
            },
            boxShadow: {
                'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                'glow': '0 0 15px rgba(59, 130, 246, 0.5)'
            }
          }
        }
      }
    </script>
    <style>
        :root {
            --font-body: 'Inter';
            --font-heading: 'Inter';
            --snow-color: #bae6fd; /* Light blue for light mode */
        }
        
        .dark {
            --snow-color: #ffffff; /* White for dark mode */
        }

        h1, h2, h3, h4, h5, h6, .font-heading {
            font-family: var(--font-heading), sans-serif !important;
        }
        
        body {
            font-family: var(--font-body), sans-serif !important;
        }

        /* Table Headers Centering */
        th, td { vertical-align: middle; }
        
        /* Global Centering Utility for specific tables */
        .text-center-all th, .text-center-all td { text-align: center !important; }

        /* Larger Calendar Icon & Theme Adaptation */
        input[type="date"] {
            color-scheme: light; /* Force light scheme icons by default for visibility */
        }
        .dark input[type="date"] {
            color-scheme: dark; /* Force dark scheme icons in dark mode */
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            width: 24px;
            height: 24px;
            margin-left: 8px;
            padding: 2px;
            opacity: 0.8;
            transition: 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
            background-color: rgba(0,0,0,0.05);
            border-radius: 4px;
        }
        
        /* Custom Scrollbar for Light Theme Search */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Drag and Drop styling */
        .dragging-row {
            opacity: 0.5;
            background-color: #f0f9ff;
        }
        .dragging-over {
            border-top: 2px solid #3b82f6;
        }

        /* Blink animation for search results */
        @keyframes blink {
            0% { background-color: rgba(59, 130, 246, 0.3); }
            50% { background-color: rgba(59, 130, 246, 0.1); }
            100% { background-color: transparent; }
        }
        .highlight-blink {
            animation: blink 2s ease-out;
        }

        /* --- UI ANIMATIONS (Polyfill for tailwindcss-animate) --- */
        .animate-in { animation-duration: 0.2s; animation-fill-mode: both; }
        .fade-in { animation-name: fadeIn; }
        .slide-in-from-top-1 { animation-name: slideInFromTop1; }
        .slide-in-from-top-2 { animation-name: slideInFromTop2; }
        .slide-in-from-bottom-2 { animation-name: slideInFromBottom2; }
        .slide-in-from-bottom { animation-name: slideInFromBottom; }
        .zoom-in { animation-name: zoomIn; }
        .zoom-in-95 { animation-name: zoomIn95; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInFromTop1 { from { transform: translateY(-0.25rem); } to { transform: translateY(0); } }
        @keyframes slideInFromTop2 { from { transform: translateY(-0.5rem); } to { transform: translateY(0); } }
        @keyframes slideInFromBottom2 { from { transform: translateY(0.5rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slideInFromBottom { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes zoomIn95 { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* --- ADVANCED SEASONAL ANIMATIONS --- */
        
        .season-element {
            position: fixed;
            pointer-events: none;
            z-index: 50; /* Front overlay */
            user-select: none;
            will-change: transform, opacity, bottom, left;
        }

        /* 1. WINTER: Snow Only */
        @keyframes fall-rotate {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.8; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .season-snowflake {
            color: var(--snow-color);
            animation-name: fall-rotate;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
            top: 0;
        }

        /* 2. SPRING: Sakura Petals */
        @keyframes petal-fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(100px) rotate(720deg) scale(0.5); opacity: 0; }
        }
        .season-petal {
            position: fixed;
            background: linear-gradient(135deg, #fbcfe8 0%, #f472b6 100%);
            border-radius: 15px 0px 15px 0px;
            pointer-events: none;
            z-index: 50;
            animation: petal-fall linear infinite;
            box-shadow: 0 0 10px rgba(244, 114, 182, 0.3);
        }

        /* 3. SUMMER: Floating Pollen / Dandelion Seeds */
        @keyframes pollen-float {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) translateX(80px) rotate(360deg); opacity: 0; }
        }
        .season-pollen {
            position: fixed;
            background: radial-gradient(circle, rgba(255, 255, 100, 1) 0%, rgba(255, 255, 0, 0.8) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 50;
            animation: pollen-float linear infinite;
            box-shadow: 0 0 12px rgba(255, 255, 0, 1);
        }
        .season-summer-leaf {
            position: fixed;
            background: linear-gradient(135deg, #86efac 0%, #22c55e 100%);
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            z-index: 50;
            animation: pollen-float linear infinite;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.8);
        }

        /* 4. AUTUMN: Falling CSS Leaves */
        @keyframes autumn-fall {
            0% { transform: translateY(-10vh) translateX(0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(110vh) translateX(150px) rotate(720deg) scale(0.8); opacity: 0; }
        }
        .season-autumn-leaf {
            position: fixed;
            background: linear-gradient(135deg, var(--leaf-color-1) 0%, var(--leaf-color-2) 100%);
            border-radius: 50% 0 50% 0;
            pointer-events: none;
            z-index: 50;
            animation: autumn-fall linear infinite;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
        .season-autumn-leaf::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50% 0 50% 0;
            background: linear-gradient(to bottom right, transparent 48%, rgba(0,0,0,0.15) 49%, transparent 51%);
             /* --- BEAUTIFUL PRINT STYLES (A4 Optimized & Capacious) --- */
        @media print {
            @page {
                size: landscape;
                margin: 6mm;
            }

            *, *:before, *:after {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                box-shadow: none !important;
                text-shadow: none !important;
            }

            body, html { 
                background: #ffffff !important; 
                color: #0f172a !important; 
                font-size: 9pt !important;
                width: 100% !important;
                height: auto !important;
                min-height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }

            /* Hide UI Elements */
            .no-print, 
            header, 
            footer, 
            nav, 
            button, 
            .lucide, 
            input[type="file"], 
            .tab-button, 
            select:not(.print-show), 
            .shadow-soft, 
            .shadow-glow, 
            .bg-gradient-to-tr, 
            .bg-gradient-to-br, 
            .season-element, 
            .season-petal, 
            .season-pollen, 
            .season-autumn-leaf, 
            .season-snowflake { 
                display: none !important; 
            }
            
            /* Reset Layout Containers */
            #root, main, .max-w-7xl, .w-full, .p-8, .p-6, .card {
                width: 100% !important;
                max-width: none !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                border: none !important;
                background: transparent !important;
                overflow: visible !important;
            }
            
            /* Remove sticky positioning for print */
            .sticky {
                position: static !important;
                left: auto !important;
                right: auto !important;
                top: auto !important;
                bottom: auto !important;
                background: transparent !important;
            }

            /* Ensure text contrast */
            .text-white, .text-slate-100, .text-slate-200, .text-slate-300, .text-slate-400 {
                color: #0f172a !important;
            }
            .bg-slate-900, .bg-slate-950, .bg-slate-800, .bg-slate-700 {
                background: #f8fafc !important;
                color: #0f172a !important;
                border: 1pt solid #cbd5e1 !important;
            }

            /* Flatten Cards */
            .card, div[class*="bg-white"], div[class*="shadow-"] { 
                box-shadow: none !important; 
                border: 1pt solid #e2e8f0 !important; 
                padding: 8px !important; 
                margin: 0 0 12px 0 !important; 
                background: #ffffff !important; 
            }

            /* Modals handling if printing from active modal */
            .fixed.inset-0 {
                position: static !important;
                width: 100% !important;
                height: auto !important;
                background: transparent !important;
                padding: 0 !important;
                display: block !important;
                backdrop-filter: none !important;
            }
            .fixed.inset-0 > div {
                max-width: 100% !important;
                max-height: none !important;
                box-shadow: none !important;
                border: none !important;
                background: transparent !important;
                overflow: visible !important;
            }

            /* --- CAPACIOUS TABLE STYLING --- */
            .overflow-x-auto, .overflow-y-auto, .overflow-hidden {
                overflow: visible !important;
                display: block !important;
                width: 100% !important;
                max-height: none !important;
            }

            table {
                width: 100% !important;
                min-width: 0 !important;
                border-collapse: collapse !important;
                border: 1pt solid #94a3b8 !important;
                margin-top: 8px !important;
                margin-bottom: 16px !important;
                font-size: 8pt !important;
                table-layout: auto !important;
            }
            
            th, td { 
                border: 1pt solid #cbd5e1 !important; 
                padding: 3px 5px !important;
                color: #0f172a !important;
                background: transparent !important;
                word-wrap: break-word !important;
                vertical-align: middle !important;
                text-align: center;
            }

            th {
                background-color: #f1f5f9 !important;
                color: #0f172a !important;
                font-weight: 700 !important;
                text-transform: uppercase;
                font-size: 7.5pt !important;
                letter-spacing: 0.02em;
                text-align: center !important;
                border-bottom: 1.5pt solid #94a3b8 !important;
            }

            tr:nth-child(even) td {
                background-color: #f8fafc !important;
            }

            thead { display: table-header-group !important; }
            tr { page-break-inside: avoid !important; }

            /* Fix inputs/selects in tables to look like text */
            input, select, textarea {
                border: none !important;
                background: transparent !important;
                padding: 0 !important;
                margin: 0 !important;
                width: auto !important;
                height: auto !important;
                box-shadow: none !important;
                font-weight: bold !important;
                text-align: center !important;
                color: #0f172a !important;
                font-size: 9pt !important;
                -webkit-appearance: none;
                appearance: none;
            }
            
            /* Remove dropdown arrows and ensure options are somewhat readable if possible (though select in print is tricky) */
            select { 
                background-image: none !important; 
                -moz-appearance: none !important;
                text-indent: 0.01px;
                text-overflow: '';
                color: black !important;
                font-weight: bold !important;
            }

            /* Special handling for Schedule Day Boxes (Schedule View) */
            /* These are usually rendered as Cards in the UI, convert to bordered blocks */
            .border.rounded-xl {
                border: 1pt solid #cbd5e1 !important;
                border-radius: 4px !important;
                margin-bottom: 15px !important;
                page-break-inside: avoid;
                box-shadow: none !important;
            }
            
            /* Remove decorative backgrounds inside Schedule Day */
            .bg-slate-50, .bg-slate-100 {
                background-color: transparent !important;
            }

            /* Ensure Title of Day is bold and clearly separated */
            .font-bold { font-weight: bold !important; }

            /* Special handling for marks color */
            .text-green-600, .text-blue-600, .text-amber-600, .text-red-600 {
                font-weight: 700 !important;
                color: black !important; /* Force B&W for clearer printing or keep color if preferred */
            }
            
            /* Force table headers to repeat */
            thead { display: table-header-group; }
            tr { page-break-inside: avoid; }

            /* Links */
            a { text-decoration: none !important; color: black !important; }
        }

        /* Basic Rich Text Styles for Quill */
        .ql-editor h1 { font-size: 2em; font-weight: bold; margin-bottom: 0.5em; }
        .ql-editor h2 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; }
        .ql-editor h3 { font-size: 1.17em; font-weight: bold; margin-bottom: 0.5em; }
        .ql-editor p { margin-bottom: 1em; }
        .ql-editor ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .ql-editor ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .ql-editor a { color: #3b82f6; text-decoration: underline; }
        .ql-editor img { max-width: 100%; height: auto; }
        .ql-editor blockquote { border-left: 4px solid #ccc; padding-left: 1em; margin-bottom: 1em; color: #666; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
